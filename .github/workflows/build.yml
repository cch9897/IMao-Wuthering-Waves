name: Build IMao (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # ---------- 1. OpenCV 4.10 + contrib with SURF (NONFREE, static /MT) ----------
      - name: Cache OpenCV build
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: C:\opencv
          key: opencv-4.10-nonfree-static-msvc-${{ runner.os }}

      - name: Build OpenCV (NONFREE)
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path C:\opencv-src | Out-Null
          cd C:\opencv-src
          curl.exe -sL -o opencv.tar.gz https://github.com/opencv/opencv/archive/refs/tags/4.10.0.tar.gz
          curl.exe -sL -o opencv_contrib.tar.gz https://github.com/opencv/opencv_contrib/archive/refs/tags/4.10.0.tar.gz
          tar xzf opencv.tar.gz
          tar xzf opencv_contrib.tar.gz
          Move-Item opencv-4.10.0 opencv
          Move-Item opencv_contrib-4.10.0 opencv_contrib
          cmake -S opencv -B opencv/build -G "Visual Studio 17 2022" -A x64 `
            -DOPENCV_EXTRA_MODULES_PATH=C:\opencv-src\opencv_contrib\modules `
            -DOPENCV_ENABLE_NONFREE=ON `
            -DBUILD_LIST=core,imgproc,imgcodecs,features2d,flann,calib3d,xfeatures2d `
            -DBUILD_SHARED_LIBS=OFF `
            -DBUILD_WITH_STATIC_CRT=ON `
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_opencv_python3=OFF -DBUILD_opencv_java=OFF `
            -DWITH_IPP=OFF -DWITH_OPENCL=OFF -DWITH_FFMPEG=OFF -DWITH_MSMF=OFF -DWITH_DSHOW=OFF -DWITH_ADE=OFF `
            -DBUILD_PNG=ON -DBUILD_JPEG=ON -DBUILD_TIFF=OFF -DBUILD_WEBP=OFF -DBUILD_ZLIB=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build opencv/build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path C:\opencv | Out-Null
          Copy-Item -Recurse opencv/build C:\opencv\build
          Copy-Item -Recurse opencv/modules C:\opencv\modules
          Copy-Item opencv/CMakeLists.txt C:\opencv\CMakeLists.txt

      # ---------- 2. Paddle Inference 2.6.2 (C++ API) ----------
      - name: Cache Paddle
        id: cache-paddle
        uses: actions/cache@v4
        with:
          path: C:\paddle_lib
          key: paddle-2.6.2-win-cpu-${{ runner.os }}

      - name: Download & extract Paddle
        if: steps.cache-paddle.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\paddle_lib | Out-Null
          cd C:\paddle_lib
          curl.exe -sL -o paddle.zip https://paddle-inference-lib.bj.bcebos.com/2.6.2/cxx_c/Windows/CPU/x86-64_avx-mkl-vs2019/paddle_inference.zip
          tar xf paddle.zip
          Remove-Item paddle.zip

      # ---------- 3. Official assets (OCR models + features) ----------
      - name: Download official assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\assets_src | Out-Null
          cd C:\assets_src
          curl.exe -sL -o official.zip https://github.com/Yepin2022/IMao-Wuthering-Waves/releases/download/1.0.2/IMao.v1.0.2.zip
          tar xf official.zip
          # 提取 Assets
          New-Item -ItemType Directory -Force -Path C:\assets | Out-Null
          Copy-Item -Recurse "IMao/Assets/*" C:\assets\

      - name: Fetch v2 map features (Mengzhou support)
        shell: pwsh
        run: |
          cd C:\assets_src
          curl.exe -sL -o v2map.7z https://github.com/cch9897/IMao-Wuthering-Waves/releases/download/v2-map/imao_v2_map.7z
          # 7z 解压（Windows 自带 tar 不支持 7z，用 Expand-Archive 也不行；先检查 7z）
          $7z = Get-Command 7z -ErrorAction SilentlyContinue
          if ($7z) {
            7z x -y v2map.7z -oC:\v2map | Out-Null
          } else {
            # GitHub runner 自带 7zip 在 Program Files
            & "C:\Program Files\7-Zip\7z.exe" x -y v2map.7z -oC:\v2map | Out-Null
          }
          Copy-Item C:\v2map\Map_features_v2.yml C:\assets\FeaturesDatas\Map_features.yml -Force

      # ---------- 4. Build IMao-Core + WinUI ----------
      - name: Configure (CMake)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DOPENCV_DIR=C:\opencv\build `
            -DPADDLE_LIB=C:\paddle_lib\paddle_inference
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---------- 5. Assemble package ----------
      - name: Assemble output
        shell: pwsh
        run: |
          $out = "x64\Release"
          New-Item -ItemType Directory -Force -Path "$out\Assets" | Out-Null
          Copy-Item -Recurse "C:\assets\*" "$out\Assets\" -Force
          # 补充 paddle 运行时 DLL（CMake POST_BUILD 只拷一部分）
          Copy-Item "C:\paddle_lib\paddle_inference\paddle\lib\paddle_inference.dll" $out -Force
          Copy-Item "C:\paddle_lib\paddle_inference\paddle\lib\common.dll" $out -Force
          Copy-Item "C:\paddle_lib\paddle_inference\third_party\install\mklml\lib\mklml.dll" $out -Force
          Copy-Item "C:\paddle_lib\paddle_inference\third_party\install\mklml\lib\libiomp5md.dll" $out -Force
          Copy-Item "C:\paddle_lib\paddle_inference\third_party\install\mkldnn\lib\mkldnn.dll" $out -Force -ErrorAction SilentlyContinue
          # 完整性清单
          Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize
          # 打包
          Compress-Archive -Path "$out\*" -DestinationPath "IMao-v2-full.zip" -Force
          Get-Item "IMao-v2-full.zip" | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMao-v2-full
          path: IMao-v2-full.zip
          retention-days: 14
