name: Build IMao (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # ---------- 0. MSVC 环境 + Ninja ----------
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      # ---------- 1. OpenCV 4.10 + contrib with SURF (NONFREE, static /MT) ----------
      - name: Cache OpenCV build
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: C:\opencv
          key: opencv-4.10-nonfree-static-msvc-v2-${{ runner.os }}

      - name: Build OpenCV (NONFREE)
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path C:\opencv | Out-Null
          cd C:\opencv
          curl.exe -sL -o opencv.tar.gz https://github.com/opencv/opencv/archive/refs/tags/4.10.0.tar.gz
          curl.exe -sL -o opencv_contrib.tar.gz https://github.com/opencv/opencv_contrib/archive/refs/tags/4.10.0.tar.gz
          tar xzf opencv.tar.gz
          tar xzf opencv_contrib.tar.gz
          Move-Item opencv-4.10.0 opencv
          Move-Item opencv_contrib-4.10.0 opencv_contrib
          cmake -S opencv -B opencv/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENCV_EXTRA_MODULES_PATH=C:\opencv\opencv_contrib\modules -DOPENCV_ENABLE_NONFREE=ON "-DBUILD_LIST=core,imgproc,imgcodecs,features2d,flann,calib3d,xfeatures2d" -DBUILD_SHARED_LIBS=OFF -DBUILD_WITH_STATIC_CRT=ON -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_opencv_python3=OFF -DBUILD_opencv_java=OFF -DBUILD_PROTOBUF=OFF -DWITH_IPP=OFF -DWITH_OPENCL=OFF -DWITH_FFMPEG=OFF -DWITH_MSMF=OFF -DWITH_DSHOW=OFF -DWITH_ADE=OFF -DBUILD_PNG=ON -DBUILD_JPEG=ON -DBUILD_TIFF=OFF -DBUILD_WEBP=OFF -DBUILD_ZLIB=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build opencv/build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item C:\opencv\opencv.tar.gz, C:\opencv\opencv_contrib.tar.gz -ErrorAction SilentlyContinue

      # ---------- 2. Paddle Inference 3.0.0 (ppocr.lib 需要 EnableNewIR API) ----------
      - name: Cache Paddle
        id: cache-paddle
        uses: actions/cache@v4
        with:
          path: C:\paddle_lib
          key: paddle-3.0.0-win-cpu-${{ runner.os }}

      - name: Download & extract Paddle
        if: steps.cache-paddle.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\paddle_lib | Out-Null
          cd C:\paddle_lib
          curl.exe -sL -o paddle.zip https://paddle-inference-lib.bj.bcebos.com/3.0.0/cxx_c/Windows/CPU/x86-64_avx-mkl-vs2019/paddle_inference.zip
          tar xf paddle.zip
          Remove-Item paddle.zip

      # ---------- 2b. yaml-cpp (ppocr.lib 依赖, Paddle 2.6.2 包不含) ----------
      - name: Install yaml-cpp (static /MT)
        shell: pwsh
        run: |
          cd C:\vcpkg
          .\vcpkg.exe install yaml-cpp --triplet x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path C:\paddle_lib\third_party\install\yaml-cpp\lib | Out-Null
          Copy-Item installed\x64-windows-static\lib\yaml-cpp.lib C:\paddle_lib\third_party\install\yaml-cpp\lib\ -Force
          Copy-Item -Recurse installed\x64-windows-static\include\yaml-cpp C:\paddle_lib\third_party\install\yaml-cpp\include\yaml-cpp -Force

      # ---------- 3. Official assets (OCR models + features) ----------
      - name: Download official assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\assets_src | Out-Null
          cd C:\assets_src
          curl.exe -sL -o official.zip https://github.com/Yepin2022/IMao-Wuthering-Waves/releases/download/1.0.2/IMao.v1.0.2.zip
          tar xf official.zip
          New-Item -ItemType Directory -Force -Path C:\assets | Out-Null
          Copy-Item -Recurse "IMao/Assets/*" C:\assets\

      - name: Fetch v2 map features (Mengzhou support)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd C:\assets_src
          curl.exe -sL -o Map_features_v2.yml https://github.com/cch9897/IMao-Wuthering-Waves/releases/download/v2-map/Map_features_v2.yml
          if (!(Test-Path Map_features_v2.yml)) { throw "v2 feature download failed" }
          $fsz = (Get-Item Map_features_v2.yml).Length
          if ($fsz -lt 500MB) { throw "v2 feature too small: $fsz (expected ~646MB)" }
          Copy-Item Map_features_v2.yml C:\assets\FeaturesDatas\Map_features.yml -Force
          Write-Host "v2 feature OK: $fsz"

      # ---------- 4. Build IMao-Core (C++ DLL) ----------
      - name: Configure IMao-Core
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENCV_DIR=C:\opencv\opencv\build -DPADDLE_LIB=C:\paddle_lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build IMao-Core
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---------- 5. Build IMao-WinUI (C# WinUI 3, .NET SelfContained) ----------
      - name: Build IMao-WinUI
        shell: pwsh
        run: |
          dotnet build IMao-WinUI/IMao-WinUI.csproj -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---------- 6. Assemble package ----------
      - name: Assemble output
        shell: pwsh
        run: |
          $out = "x64\Release"
          New-Item -ItemType Directory -Force -Path "$out\Assets" | Out-Null
          Copy-Item -Recurse "C:\assets\*" "$out\Assets\" -Force
          # paddle 运行时 DLL
          Copy-Item "C:\paddle_lib\paddle\lib\paddle_inference.dll" $out -Force
          Copy-Item "C:\paddle_lib\paddle\lib\common.dll" $out -Force
          Copy-Item "C:\paddle_lib\third_party\install\mklml\lib\mklml.dll" $out -Force
          Copy-Item "C:\paddle_lib\third_party\install\mklml\lib\libiomp5md.dll" $out -Force
          Copy-Item "C:\paddle_lib\third_party\install\mkldnn\lib\mkldnn.dll" $out -Force -ErrorAction SilentlyContinue
          # 校验 v2 特征已正确打入（新坐标系特征 >500MB；旧版 482MB 坐标范围不对，必须替换）
          $mf = "$out\Assets\FeaturesDatas\Map_features.yml"
          if (!(Test-Path $mf)) { throw "Map_features.yml missing in output" }
          $msz = (Get-Item $mf).Length
          if ($msz -lt 500MB) { throw "Map_features.yml wrong size in output: $msz (v2 expected ~646MB)" }
          Write-Host "output Map_features.yml OK: $msz"
          Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize
          Compress-Archive -Path "$out\*" -DestinationPath "IMao-v2-full.zip" -Force
          Get-Item "IMao-v2-full.zip" | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMao-v2-full
          path: IMao-v2-full.zip
          retention-days: 14
